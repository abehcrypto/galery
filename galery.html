<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Up My Gallery Overlay</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }
    
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        font-family: 'Press Start 2P', cursive, monospace;
        overflow: hidden;
    }

    #gallery-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 480px;
        background: rgba(15, 12, 30, 0.85);
        border: 2px solid #5d3ebd;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 0 15px rgba(123, 44, 191, 0.6);
        color: #fff;
    }

    .title {
        text-align: center;
        font-size: 13px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 12px;
        text-transform: uppercase;
    }

    .carousel-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
    }

    .carousel-track {
        display: flex;
        gap: 15px;
        width: max-content;
        animation: scroll 18s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .gift-card {
        background: rgba(30, 20, 60, 0.7);
        border: 1px solid #7b2cbf;
        border-radius: 8px;
        padding: 8px;
        width: 95px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
    }

    .gift-card.completed {
        border-color: #00ff66;
        box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
    }

    .gift-img {
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .gift-quantity {
        position: absolute;
        top: 22px;
        background: #ff0055;
        color: #fff;
        font-size: 8px;
        padding: 2px 4px;
        border-radius: 4px;
        font-weight: bold;
    }

    .gift-name {
        font-size: 7px;
        color: #00f5d4;
        text-align: center;
        margin-top: 6px;
        line-height: 1.2;
        text-transform: uppercase;
    }

    /* Pop-up de Destaque no Centro */
    #alert-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: rgba(15, 12, 30, 0.95);
        border: 4px solid #00ff66;
        border-radius: 16px;
        padding: 20px 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(0, 255, 102, 0.8);
        z-index: 9999;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #alert-popup.active {
        transform: translate(-50%, -50%) scale(1);
    }

    #alert-popup img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        margin: 10px 0;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
    }

    #alert-popup .alert-title {
        color: #fca311;
        font-size: 16px;
        text-shadow: 2px 2px #000;
        margin-bottom: 5px;
    }

    #alert-popup .alert-name {
        color: #00f5d4;
        font-size: 14px;
        text-shadow: 2px 2px #000;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<!-- Alerta Pop-up -->
<div id="alert-popup">
    <div class="alert-title">✨ ITEM ILUMINADO! ✨</div>
    <img id="alert-img" src="" alt="Presente">
    <div id="alert-name" class="alert-name"></div>
</div>

<div id="gallery-container">
    <div class="title">✨ LIGHT UP MY GALLERY ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="track"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>
<script>
const CONFIG = {
    actionName: "PRESENTES",
    galleryVersion: "v1_semana1_reset", // Versão limpa sem testes

    galleryGifts: {
        "7001": { name: "Apoio LUVX", quantity: 1, image: "apoio_luvx.png" },
        "6120": { name: "Batidas do Coração", quantity: 1, image: "batidas_do_coração.png" },
        "6427": { name: "Chapéu e Bigode", quantity: 1, image: "chapéu_e_bigode.png" },
        "6801": { name: "Cisne", quantity: 1, image: "cisne.png" },
        "5912": { name: "Corações", quantity: 1, image: "corações.png" },
        "6267": { name: "Corgi", quantity: 1, image: "corgi.png" },
        "5487": { name: "Mãos em coração", quantity: 1, image: "mãos_em_coração.png" },
        "5656": { name: "Mãos fazendo coração", quantity: 4, image: "mãos_fazendo_coração.png" },
        "6523": { name: "Pistola de dinheiro", quantity: 1, image: "pistola_de_dinheiro.png" },
        "5655": { name: "Rosa", quantity: 1, image: "rosa.png" },
        "5879": { name: "Rosquinha", quantity: 2, image: "rosquinha.png" }
    }
};

const STORAGE_KEY = "gallery_progress_" + CONFIG.galleryVersion;

// Limpa qualquer resquício de teste anterior
localStorage.removeItem("gallery_progress_v1_semana1");

// Estado inicial exato da imagem enviada
let progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    "7001": 1, // Apoio LUVX (1/1)
    "5487": 1, // Mãos em coração (1/1)
    "5655": 1, // Rosa (1/1)
    "6427": 1, // Chapéu e Bigode (1/1)
    "5656": 1  // Mãos fazendo coração (1/4)
};

function renderGallery() {
    const track = document.getElementById("track");
    track.innerHTML = "";

    const giftEntries = Object.entries(CONFIG.galleryGifts);
    const fullList = [...giftEntries, ...giftEntries];

    fullList.forEach(([giftId, item]) => {
        const currentQty = progress[giftId] || 0;
        const isDone = currentQty >= item.quantity;

        const card = document.createElement("div");
        card.className = `gift-card ${isDone ? 'completed' : ''}`;

        card.innerHTML = `
            <img class="gift-img" src="${item.image}" alt="${item.name}">
            <div class="gift-quantity">${currentQty}/${item.quantity}</div>
            <div class="gift-name">${item.name}</div>
        `;

        track.appendChild(card);
    });
}

function triggerAlert(item) {
    const popup = document.getElementById("alert-popup");
    const img = document.getElementById("alert-img");
    const name = document.getElementById("alert-name");

    img.src = item.image;
    name.textContent = item.name;

    // Toca o áudio criando uma nova instância direta
    try {
        const audio = new Audio("alert.mp3");
        audio.play().catch(err => console.log("Aguardando clique na tela para liberar o som:", err));
    } catch(e) {
        console.error("Erro ao carregar o arquivo de áudio:", e);
    }

    // Ativa o Pop-up no centro da tela por 4 segundos
    popup.classList.add("active");
    setTimeout(() => {
        popup.classList.remove("active");
    }, 4000);
}

function processGift(giftId) {
    const item = CONFIG.galleryGifts[giftId];
    if (item) {
        progress[giftId] = (progress[giftId] || 0) + 1;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        renderGallery();
        triggerAlert(item);
    }
}

// Atalhos de teclado para testes rápidos no navegador:
// Tecla "T" = Testa o alerta com a Rosquinha
// Tecla "S" = Testa apenas o arquivo de áudio
document.addEventListener("keydown", (e) => {
    if (e.key === "t" || e.key === "T") processGift("5879");
    if (e.key === "s" || e.key === "S") new Audio("alert.mp3").play();
});

function connectStreamerbot() {
    try {
        const client = new StreamerbotClient({ host: "127.0.0.1", port: 8080, endpoint: "/" });
        client.on("Raw.Action", ({ data }) => {
            const actionName = data?.name || data?.actionName || "";
            if (actionName === CONFIG.actionName) {
                const giftId = String(data?.arguments?.giftId || "");
                processGift(giftId);
            }
        });
    } catch (e) {
        setTimeout(connectStreamerbot, 5000);
    }
}

renderGallery();
connectStreamerbot();
</script>
</body>
</html>
